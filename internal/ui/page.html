<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rist Local UI</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-zinc-100 text-black antialiased">
  <main class="mx-auto grid w-full max-w-5xl gap-4 p-4 md:p-6">
    <section class="rounded-md border border-black/10 bg-white p-4 shadow-sm">
      <h1 class="text-2xl font-semibold tracking-tight">Rist Local UI</h1>
      <div class="mt-1 text-sm text-black/70">CLI-backed orchestration only. Commands execute through rist.</div>
    </section>

    <section class="rounded-md border border-black/10 bg-white p-4 shadow-sm">
      <h2 class="text-base font-semibold">Edit Config YAML</h2>
      <form method="post" action="/config/save">
        <textarea
          class="mt-3 min-h-64 w-full rounded-md border border-black/15 bg-white p-3 font-mono text-sm outline-none ring-0 transition focus:border-black/40"
          name="yaml"
        >{{.ConfigYAML}}</textarea>
        <div class="mt-3">
          <button
            class="inline-flex items-center rounded-md border border-black px-3 py-2 text-sm font-medium text-black transition hover:bg-black hover:text-white"
            type="submit"
          >
            Save Config
          </button>
        </div>
      </form>
    </section>

    <section class="rounded-md border border-black/10 bg-white p-4 shadow-sm">
      <h2 class="text-base font-semibold">Run CLI Command</h2>
      <form method="post" action="/run" class="mt-3 grid gap-2 md:grid-cols-[1fr_auto]">
        <div>
          <input
            class="w-full rounded-md border border-black/15 bg-white px-3 py-2 text-sm outline-none transition focus:border-black/40"
            type="text"
            name="command"
            placeholder="repo list | repo init main | backup main | check main"
          />
        </div>
        <div>
          <button
            class="inline-flex w-full items-center justify-center rounded-md border border-black bg-black px-3 py-2 text-sm font-medium text-white transition hover:bg-white hover:text-black"
            type="submit"
          >
            Run
          </button>
        </div>
      </form>
    </section>

    <section class="rounded-md border border-black/10 bg-white p-4 shadow-sm">
      <h2 class="text-base font-semibold">Set Repo Password</h2>
      <form method="post" action="/pw/set" class="mt-3 grid gap-2 md:grid-cols-3">
        <div>
          <input
            class="w-full rounded-md border border-black/15 bg-white px-3 py-2 text-sm outline-none transition focus:border-black/40"
            type="text"
            name="repoID"
            placeholder="repo id"
          />
        </div>
        <div>
          <input
            class="w-full rounded-md border border-black/15 bg-white px-3 py-2 text-sm outline-none transition focus:border-black/40"
            type="password"
            name="password"
            placeholder="password"
          />
        </div>
        <div>
          <button
            class="inline-flex w-full items-center justify-center rounded-md border border-black px-3 py-2 text-sm font-medium text-black transition hover:bg-black hover:text-white"
            type="submit"
          >
            Store Password
          </button>
        </div>
      </form>
    </section>

    <section class="rounded-md border border-black/10 bg-white p-4 shadow-sm">
      <h2 class="text-base font-semibold">Command Output</h2>
      <div class="mt-3 min-h-16 whitespace-pre-wrap rounded-md border border-black/10 bg-neutral-50 p-3 font-mono text-sm text-black">{{.Output}}</div>
      <div class="mt-2 whitespace-pre-wrap text-sm font-medium text-black">{{.Error}}</div>
    </section>
  </main>
</body>
</html>
